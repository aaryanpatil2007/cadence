[project]
name = "gait"
version = "0.1.0"
description = "Behavioral proof-of-identity daemon for macOS"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "pydantic>=2.8",
    "cryptography>=43.0",
    "python-jose>=3.3",
    "httpx>=0.27",
    "pytest>=8.0",
    "pyautogui>=0.9.54",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gait"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
