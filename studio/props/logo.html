<!doctype html>
<html>
<head><meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@800&display=swap');
  html,body{margin:0;height:100%;background:#ffffff;overflow:hidden}
  .wrap{height:100vh;display:flex;align-items:center;justify-content:center}
  .logo{display:flex;align-items:center;gap:20px;opacity:0}
  .badge{width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:#000}
  .badge .sq{width:16px;height:16px;background:#c90000}
  .word{font-family:'Host Grotesk',Arial,sans-serif;font-weight:800;font-size:56px;color:#000;
    letter-spacing:-.035em}
</style></head>
<body>
  <div class="wrap">
    <div class="logo" id="logo">
      <div class="badge"><div class="sq"></div></div>
      <div class="word">Cadence</div>
    </div>
  </div>
<script>
  window.__play = () => {
    const logo = document.getElementById('logo');
    const t0 = performance.now();
    (function loop(now){
      const t = Math.min((now-t0)/500, 1);
      logo.style.opacity = String(t);
      if(t<1) requestAnimationFrame(loop);
    })(t0);
  };
</script>
</body>
</html>
